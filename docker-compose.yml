version: "3.9"

services:
  web:
    build: .
    container_name: s3like_web
    environment:
      FLASK_ENV:      ${FLASK_ENV:-development}
      SECRET_KEY:     ${SECRET_KEY:-super-secret-key-change-me}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-testkey}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-testsecret}
      S3_ENDPOINT_URL:   ${S3_ENDPOINT_URL:-http://localhost:5555}
      S3_REGION:         ${S3_REGION:-us-east-1}
      S3_USE_SSL:        ${S3_USE_SSL:-False}
    ports:
      - "5000:5000"
    restart: unless-stopped