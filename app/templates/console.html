<!doctype html><title>S3Like Console</title><h1>S3Like Console</h1><p>API endpoint: <code>http://localhost:9000</code> · <a href="/health/live">health</a></p><form method="post" action="/bucket/create"><input name="name" placeholder="new-bucket" required><button>Create bucket</button></form><h2>Buckets</h2><ul>{% for b in buckets %}<li><a href="/bucket/{{ b['name'] }}">{{ b['name'] }}</a> (created {{ b['created_at'] }}) <form style="display:inline" method="post" action="/bucket/{{ b['name'] }}/delete"><button>delete</button></form></li>{% else %}<li>No buckets</li>{% endfor %}</ul>
