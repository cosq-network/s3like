<!doctype html><title>{{ bucket }} · S3Like</title><p><a href="/">← Buckets</a></p><h1>{{ bucket }}</h1><form method="post" action="/bucket/{{ bucket }}/upload" enctype="multipart/form-data"><input type="file" name="file"><button>Upload</button></form><table><tr><th>Key</th><th>Size</th><th>ETag</th><th>Content type</th><th>Last modified</th><th>Actions</th></tr>{% for o in objects %}<tr><td>{{ o['key'] }}</td><td>{{ o['size'] }}</td><td>{{ o['etag'] }}</td><td>{{ o['content_type'] }}</td><td>{{ o['last_modified'] }}</td><td><a href="/bucket/{{ bucket }}/download/{{ o['key'] }}">download</a> <form style="display:inline" method="post" action="/bucket/{{ bucket }}/delete/{{ o['key'] }}"><button>delete</button></form></td></tr>{% else %}<tr><td colspan="6">No objects</td></tr>{% endfor %}</table>
