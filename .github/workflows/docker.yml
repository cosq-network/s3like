name: Validate and publish Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/**']
    tags: ['v*.*.*']
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r test-requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m pytest tests/unit -q

      - name: Run integration tests
        run: python -m pytest tests/integration -q

      - name: Validate root Compose file
        run: docker compose config

      - name: Validate consumer Compose file
        working-directory: examples/consumer-compose
        run: docker compose config

      - name: Build Docker image
        run: docker build --tag s3like:ci .

      - name: Run Docker health smoke test
        shell: bash
        run: |
          set -euo pipefail
          container="s3like-ci-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name "$container" \
            --publish 19000:9000 --publish 19001:9001 \
            s3like:ci >/dev/null

          for _ in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
            case "$status" in
              healthy) break ;;
              unhealthy) docker logs "$container"; exit 1 ;;
            esac
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy

          test "$(docker inspect --format '{{json .Config.ExposedPorts}}' "$container")" = '{"9000/tcp":{},"9001/tcp":{}}'
          test "$(docker inspect --format '{{range .Mounts}}{{.Destination}}{{end}}' "$container")" = '/data'
          test "$(docker inspect --format '{{json .Config.Cmd}}' "$container")" = '["python","-m","app.container"]'
          docker inspect "$container" | grep --fixed-strings --quiet 'health/ready'
          docker inspect "$container" | grep --fixed-strings --quiet 'health/live'
          curl --fail --silent http://127.0.0.1:19000/health/ready >/dev/null
          curl --fail --silent http://127.0.0.1:19001/health/live >/dev/null

  publish:
    name: Publish Docker Hub image
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Read and verify release version
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          app_version="$(python -c 'import ast; tree=ast.parse(open("app/version.py").read()); print(ast.literal_eval(next(n.value for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "__version__" for t in n.targets))))')"
          if [[ "$tag_version" != "$app_version" ]]; then
            echo "Tag version $tag_version does not match app/version.py version $app_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cosqnetwork/s3like
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
